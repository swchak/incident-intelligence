[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-intelligence"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "numpy",
  "pandas",
  "scipy",
  "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
incident-generate = "incident_intelligence.cli.generator:main"
incident-generate-sequence = "incident_intelligence.cli.generate_sequence:main"
incident-build-temporal-features = "incident_intelligence.cli.build_temporal_features:main"
incident-train = "incident_intelligence.cli.train:main"
incident-evaluate = "incident_intelligence.cli.evaluate:main"
incident-explain = "incident_intelligence.cli.explain:main"
incident-explain-local = "incident_intelligence.cli.explain_local:main"
incident-pipeline = "incident_intelligence.cli.pipeline:main"
incident-api = "incident_intelligence.api.app:main"

[tool.incident_intelligence.generator]
n_samples = 10000
seed = 42
raw_out = "raw/incidents_raw.csv"
processed_dir = "processed"
train_size = 0.70
val_size = 0.15
label_col = "root_cause_label"


[tool.incident_intelligence.sequence_generator]
n_incidents = 5000
sequence_length = 20
random_seed = 42
output = "data/raw/incidents_sequence_raw.csv"
label_probs = { memory_leak = 0.18, bad_deployment = 0.15, external_dependency_failure = 0.17, cpu_saturation = 0.16, traffic_spike = 0.14, normal = 0.20 }

[tool.incident_intelligence.temporal_features]
input = "data/raw/incidents_sequence_raw.csv"
output_dir = "data/processed"

[tool.incident_intelligence.train]
train_snapshot = "data/processed/incident_snapshot_train.csv"
val_snapshot = "data/processed/incident_snapshot_val.csv"
train_temporal = "data/processed/incident_temporal_train.csv"
val_temporal = "data/processed/incident_temporal_val.csv"
label_col = "root_cause_label"
models_out_dir = "artifacts/models"
metrics_out_json = "artifacts/metrics/train_val_results.json"
leaderboard_out_csv = "artifacts/metrics/leaderboard_val.csv"
best_model_out = "artifacts/models/best_model.joblib"
cv = 5
n_jobs = -1
verbose = 1
scoring = "f1_macro"
models = ["logistic", "rf", "gb", "svm"]
fast_mode = false

[tool.incident_intelligence.evaluate]
data = "data/processed/incident_snapshot_eval.csv"
label_col = "root_cause_label"
models_dir = "artifacts/models"
metrics_out = "artifacts/metrics/evaluation.json"
summary_csv_out = "artifacts/metrics/evaluation_summary.csv"

[tool.incident_intelligence.explain]
data = "data/processed/incident_snapshot_eval.csv"
label_col = "root_cause_label"
models_dir = "artifacts/models"
out_dir = "artifacts/explain"
background_n = 100
explain_n = 200
kernel_bg = 40
kernel_nsamples = 80
perm_repeats = 10
random_state = 42
top_k = 20

[tool.incident_intelligence.explain_local]
data = "data/processed/incident_snapshot_eval.csv"
label_col = "root_cause_label"
out_dir = "artifacts/explain"
background_n = 100
explain_n = 200
kernel_bg = 40
kernel_nsamples = 80
perm_repeats = 10
random_state = 42
top_k = 20
n_examples = 3
top_k_classes = 3
top_features_per_class = 8
model = "artifacts/models/best_model.joblib"
