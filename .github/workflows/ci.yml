name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Run test suite
        run: make test
        env:
          PY: python
          MPLBACKEND: Agg
          MPLCONFIGDIR: /tmp

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Build API container
        run: docker build -f Dockerfile.api -t incident-intelligence-api:test .

      - name: Build web container
        run: docker build -f Dockerfile.web -t incident-intelligence-web:test .
